[project]
name = "ktv-studio-backend"
version = "0.1.0"
description = "KTV Studio（卡拉錄唱室）本地後端：去人聲、KTV 字幕、錄音成品"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "yt-dlp>=2025.6.30",
  "demucs>=4.0.1,<5",
  "faster-whisper>=1.0.3,<2",
  "pykakasi>=2.2,<3",
  "opencc-python-reimplemented>=0.1.7,<1",
  "pydantic>=2.7,<3",
]

[tool.uv]
package = false
